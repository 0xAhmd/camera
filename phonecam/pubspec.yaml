name: phonecam_mobile
description: Turn your phone into a webcam over Wi-Fi

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Camera
  camera: ^0.10.5+9
  
  # WebSocket client/server
  web_socket_channel: ^2.4.0
  shelf: ^1.4.1
  shelf_web_socket: ^1.0.4
  
  # QR code
  mobile_scanner: ^3.5.6
  qr_flutter: ^4.1.0
  
  # Background service (Android foreground service)
  flutter_foreground_task: ^6.1.3
  
  # Wake lock (keep screen/CPU awake)
  wakelock_plus: ^1.1.4
  
  # Network info (get local IP)
  network_info_plus: ^4.1.0
  
  # Image compression
  flutter_image_compress: ^2.1.0
  
  # Preferences
  shared_preferences: ^2.2.2
  
  # mDNS discovery
  multicast_dns: ^0.3.2+1
  
  # UI
  google_fonts: ^6.1.0
  provider: ^6.1.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
